name: Migrate encrypted deployment secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare GitHub's documented sealed-box encryption library
        run: |
          python3 -c 'import nacl' || python3 -m pip install --quiet PyNaCl
      - name: Encrypt only the approved deployment secrets
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_DEPLOY_PATH: ${{ secrets.NAS_DEPLOY_PATH }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from nacl import encoding, public

          # GitHub's encryption public key for meserwinowski/website-content.
          key = public.PublicKey(b"+FkLT6aM/RY52V6X1AmiEoCTiAXVP7WhT5UA74p4Tl4=", encoding.Base64Encoder())
          box = public.SealedBox(key)
          names = ["NAS_SSH_KEY", "NAS_HOST", "NAS_USER", "NAS_DEPLOY_PATH", "TS_OAUTH_CLIENT_ID", "TS_OAUTH_SECRET"]
          if any(not os.environ.get(name) for name in names):
              raise SystemExit("An approved deployment secret is missing; nothing exported.")
          output = Path("sealed")
          output.mkdir(mode=0o700)
          for name in names:
              encrypted = base64.b64encode(box.encrypt(os.environ[name].encode())).decode()
              (output / (name + ".json")).write_text(json.dumps({
                  "key_id": "3380204578043523366",
                  "encrypted_value": encrypted,
              }))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-website-deploy-secrets
          path: sealed/
          retention-days: 1
